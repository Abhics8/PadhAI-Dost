services:
  - type: web
    name: padhai-dost-backend
    env: python
    region: ohio
    plan: free
    rootDir: python-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://padhai-dost-v2.vercel.app"
